<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ana Sayfa</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg: #0D0D0D;
            --surface: #161616;
            --surface2: #1E1E1E;
            --border: #252525;
            --accent: #4D9EFF;
            --text: #F0F0F0;
            --text-muted: #555;
            --text-dim: #888;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px 32px;
            overflow-x: hidden;
        }

        /* SAAT */
        .clock-section { width: 100%; text-align: center; padding: 48px 0 32px; animation: fadeUp 0.4s ease both; }
        .clock { font-size: 64px; font-weight: 300; letter-spacing: -2px; color: var(--text); line-height: 1; font-variant-numeric: tabular-nums; }
        .clock span { color: var(--accent); animation: blink 1s step-end infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
        .date { font-size: 14px; color: var(--text-dim); margin-top: 8px; letter-spacing: 0.5px; }

        /* ARAMA */
        .search-section { width: 100%; max-width: 480px; margin-bottom: 36px; animation: fadeUp 0.4s 0.08s ease both; }
        .search-wrap { position: relative; display: flex; align-items: center; }
        .search-icon { position: absolute; left: 16px; width: 18px; height: 18px; opacity: 0.4; pointer-events: none; }
        .search-input {
            width: 100%; height: 52px;
            background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
            padding: 0 52px 0 48px; color: var(--text); font-size: 15px; font-family: inherit;
            outline: none; transition: border-color 0.2s, box-shadow 0.2s; caret-color: var(--accent);
        }
        .search-input::placeholder { color: var(--text-muted); }
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(77,158,255,0.1); }
        .search-btn {
            position: absolute; right: 8px; width: 36px; height: 36px;
            background: var(--accent); border: none; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: opacity 0.15s;
        }
        .search-btn:active { opacity: 0.8; }
        .search-btn svg { width: 16px; height: 16px; stroke: #fff; fill: none; }

        /* KISAYOLLAR */
        .shortcuts-section { width: 100%; max-width: 480px; margin-bottom: 32px; animation: fadeUp 0.4s 0.16s ease both; }
        .section-label { font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 14px; }
        .shortcuts-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }
        .shortcut {
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            text-decoration: none; padding: 14px 8px;
            background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
            transition: background 0.15s, transform 0.1s;
        }
        .shortcut:active { transform: scale(0.95); background: var(--surface2); }
        .shortcut-icon {
            width: 40px; height: 40px; border-radius: 10px;
            background: var(--surface2); display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .shortcut-icon img { width: 24px; height: 24px; object-fit: contain; }
        .shortcut-label { font-size: 11px; color: var(--text-dim); font-weight: 500; text-align: center; }

        /* ÖNERİLER */
        .suggestions-section { width: 100%; max-width: 480px; margin-bottom: 32px; animation: fadeUp 0.4s 0.24s ease both; }
        .suggestion-row {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
            text-decoration: none; margin-bottom: 8px; transition: background 0.15s, transform 0.1s;
        }
        .suggestion-row:active { transform: scale(0.98); background: var(--surface2); }
        .suggestion-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .suggestion-name { font-size: 14px; color: var(--text); font-weight: 500; }
        .suggestion-url { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .suggestion-arrow { opacity: 0.2; font-size: 16px; color: var(--text); }

        /* GİZLİLİK ROZET */
        .privacy-badge {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 16px;
            background: rgba(77,158,255,0.06); border: 1px solid rgba(77,158,255,0.15); border-radius: 10px;
            margin-top: auto; animation: fadeUp 0.4s 0.32s ease both;
        }
        .privacy-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }
        .privacy-text { font-size: 12px; color: var(--accent); font-weight: 500; }

        @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    </style>
</head>
<body>

    <div class="clock-section">
        <div class="clock" id="clock">00<span>:</span>00</div>
        <div class="date" id="date"></div>
    </div>

    <div class="search-section">
        <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round">
                <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
            </svg>
            <input class="search-input" id="searchInput" type="text"
                placeholder="Ara veya adres gir..."
                autocomplete="off" autocorrect="off" spellcheck="false"
                onkeydown="if(event.key==='Enter') search()">
            <button class="search-btn" onclick="search()">
                <svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="shortcuts-section">
        <div class="section-label">Hızlı Erişim</div>
        <div class="shortcuts-grid">
            <a class="shortcut" href="https://www.google.com">
                <div class="shortcut-icon"><img src="https://www.google.com/favicon.ico"></div>
                <span class="shortcut-label">Google</span>
            </a>
            <a class="shortcut" href="https://www.youtube.com">
                <div class="shortcut-icon"><img src="https://www.youtube.com/favicon.ico"></div>
                <span class="shortcut-label">YouTube</span>
            </a>
            <a class="shortcut" href="https://www.instagram.com">
                <div class="shortcut-icon"><img src="https://www.instagram.com/favicon.ico"></div>
                <span class="shortcut-label">Instagram</span>
            </a>
            <a class="shortcut" href="https://twitter.com">
                <div class="shortcut-icon"><img src="https://twitter.com/favicon.ico"></div>
                <span class="shortcut-label">Twitter</span>
            </a>
            <a class="shortcut" href="https://www.amazon.com.tr">
                <div class="shortcut-icon"><img src="https://www.amazon.com/favicon.ico"></div>
                <span class="shortcut-label">Amazon</span>
            </a>
            <a class="shortcut" href="https://www.hepsiburada.com">
                <div class="shortcut-icon"><img src="https://www.hepsiburada.com/favicon.ico"></div>
                <span class="shortcut-label">Hepsiburada</span>
            </a>
            <a class="shortcut" href="https://www.trendyol.com">
                <div class="shortcut-icon"><img src="https://www.trendyol.com/favicon.ico"></div>
                <span class="shortcut-label">Trendyol</span>
            </a>
            <a class="shortcut" href="https://eksisozluk.com">
                <div class="shortcut-icon"><img src="https://eksisozluk.com/favicon.ico"></div>
                <span class="shortcut-label">Ekşi</span>
            </a>
        </div>
    </div>

    <div class="suggestions-section">
        <div class="section-label">Keşfet</div>
        <a class="suggestion-row" href="https://news.google.com/topstories?hl=tr&gl=TR">
            <div class="suggestion-dot" style="background:#FF6B6B"></div>
            <div style="flex:1">
                <div class="suggestion-name">Gündem Haberleri</div>
                <div class="suggestion-url">news.google.com</div>
            </div>
            <div class="suggestion-arrow">›</div>
        </a>
        <a class="suggestion-row" href="https://www.ntv.com.tr">
            <div class="suggestion-dot" style="background:#FFB347"></div>
            <div style="flex:1">
                <div class="suggestion-name">NTV</div>
                <div class="suggestion-url">ntv.com.tr</div>
            </div>
            <div class="suggestion-arrow">›</div>
        </a>
        <a class="suggestion-row" href="https://www.mackolik.com">
            <div class="suggestion-dot" style="background:#4D9EFF"></div>
            <div style="flex:1">
                <div class="suggestion-name">Maçkolik — Canlı Skorlar</div>
                <div class="suggestion-url">mackolik.com</div>
            </div>
            <div class="suggestion-arrow">›</div>
        </a>
        <a class="suggestion-row" href="https://www.github.com">
            <div class="suggestion-dot" style="background:#A78BFA"></div>
            <div style="flex:1">
                <div class="suggestion-name">GitHub</div>
                <div class="suggestion-url">github.com</div>
            </div>
            <div class="suggestion-arrow">›</div>
        </a>
    </div>

    <div class="privacy-badge">
        <div class="privacy-dot"></div>
        <span class="privacy-text">Reklam engelleme aktif — Korumalı bağlantı</span>
    </div>

    <script>
        function updateClock() {
            var now = new Date();
            var h = String(now.getHours()).padStart(2,'0');
            var m = String(now.getMinutes()).padStart(2,'0');
            document.getElementById('clock').innerHTML = h + '<span>:</span>' + m;
            var days = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
            var months = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
            document.getElementById('date').textContent =
                days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
        }
        updateClock();
        setInterval(updateClock, 1000);

        function search() {
            var q = document.getElementById('searchInput').value.trim();
            if (!q) return;
            window.location.href = 'search://' + encodeURIComponent(q);
        }

        setTimeout(function() { document.getElementById('searchInput').focus(); }, 300);
    </script>
</body>
</html>
